<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biểu đồ tổng quan</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --accent:#2b8be6;
      --accent-2:#1e88e5;
      --danger:#e53935;
      --muted:#6b7280;
      --border:#e6eef9;
      --shadow: 0 8px 30px rgba(43,67,99,0.08);
      --radius:12px;
      --max-width:1100px;
    }
    *{ box-sizing: border-box; font-family: Roboto, Inter, system-ui, -apple-system, 'Segoe UI', Arial; }
    body{ background: var(--bg); color:#24313a; -webkit-font-smoothing:antialiased }
    h1{font-size:20px; margin-bottom:12px; font-weight:700}
    header{ position:fixed; top:0; left:0; right:0; height:64px; background:linear-gradient(90deg,#fff,#fbfdff); display:flex; align-items:center; justify-content:space-between; padding:0 18px; box-shadow:var(--shadow); z-index:1000 }
    .logo{ font-weight:800; color:var(--accent); font-size:16px }
    .desktop-nav a{ margin-left:14px; font-size:14px; color:#2b3b4a; text-decoration:none }
    @media (max-width:768px){ .desktop-nav{ display:none } }
    .page{ max-width:var(--max-width); margin:0 auto; padding-top:92px; padding-left:16px; padding-right:16px }

    .chart-wrap{ max-width:1000px; height:460px; margin:0 auto; border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); border:1px solid var(--border); padding:18px }
    canvas{ width:100% !important; height:100% !important; display:block }

    /* Inputs */
    .mb-3 .form-control{ border:1px solid #e6eef9; border-radius:10px; background:linear-gradient(180deg,#fff,#fbfdff); padding:10px 12px }
    .mb-3 label{ font-weight:600; color:var(--muted); font-size:13px }
    input[type='text']{ text-align:right }

    /* Summary boxes */
    #summaryBox{ margin-top:18px; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start }
    #summaryBox > div { flex:1; min-width:220px }
    #summaryBox table{ width:100%; border-collapse:separate; border-spacing:0; border-radius:10px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,0.04) }
    #summaryBox td{ padding:10px; border-bottom:1px solid rgba(46,66,90,0.06); background-clip:padding-box }
    #summaryBox tr:last-child td{ border-bottom:0 }

    /* Buttons */
    .btn-primary{ background:var(--accent); border:none; box-shadow:none }
    .btn-outline-secondary{ border-radius:10px }
    /* Save button sizing to match inputs */
    #saveTargetsBtn{ height:40px; display:inline-flex; align-items:center; padding:6px 14px; border-radius:10px }

    /* Modal / login input styling */
    .modal .modal-dialog{ max-width:420px }
    .modal .modal-content{ border-radius:12px; padding:0; overflow:hidden }
    .modal .modal-header{ border-bottom:0; padding:16px 20px }
    .modal .modal-title{ margin:0; font-weight:700; font-size:18px }
    .modal .modal-body{ padding:18px 20px }
    .modal .form-label{ font-weight:600; font-size:14px }
    .modal .input-group{ border:1px solid #e6eef9; border-radius:10px; overflow:hidden; display:flex; align-items:center }
    .modal .input-group .form-control{ border:0; box-shadow:none; border-radius:0; padding:10px 12px }
    .modal .input-group .btn{ border:0; box-shadow:none; min-width:44px; padding:6px 8px; background:transparent }
    #loginError{ font-size:14px }
    @media (max-width:420px){ .modal .modal-dialog{ max-width:92% } }

    @media (max-width:768px){ .chart-wrap{ height:340px } .page{ padding-top:86px } }
    @media (max-width:480px){ #summaryBox > div{ min-width:160px } #summaryBox table{ font-size:13px } }
    /* Customers table mobile friendly: stack rows and show labels */
    #customersTable td, #customersTable th{ white-space:nowrap; }
    @media (max-width:576px){
      #customersTable thead{ display:none; }
      #customersTable{ border:0; }
      #customersTable tbody tr{ display:block; margin-bottom:10px; border:1px solid rgba(0,0,0,0.06); border-radius:8px; padding:8px; background:#fff }
      #customersTable tbody td{ display:flex; justify-content:space-between; padding:6px 8px; border:0; }
      #customersTable tbody td:before{ content: attr(data-label); font-weight:600; color:var(--muted); margin-right:8px; }
      #customersTable tbody td[data-label='#']{ display:none; }
    }
  </style>
</head>
<body>
  <header>
      <div class="logo">🚗 Batch 41</div>
      <nav class="desktop-nav">
        <a href="./index.html">Tính trả góp</a>
        <a href="./cancel_contract.html">Huỷ HĐ</a>
        <a href="./target.html">Tổng quan chỉ tiêu</a>
        <a href="#" onclick="logout()">Đăng xuất</a>
      </nav>
      <!-- HAMBURGER -->
      <button
        class="btn btn-outline-primary d-md-none"
        data-bs-toggle="offcanvas"
        data-bs-target="#mobileMenu"
      >
        ☰
      </button>
    </header>
    <!-- ===== MOBILE MENU ===== -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">🚗 Batch 41</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>
      <div class="offcanvas-body">
        <a class="btn btn-light w-100 mb-2" href="index.html"
          >📊 Tính trả góp</a
        >
        <a class="btn btn-light w-100 mb-2" href="cancel_contract.html"
        >❌ Huỷ hợp đồng</a
        >
        <a class="btn btn-light w-100 mb-2" href="./target.html">📈 Tổng quan chỉ tiêu</a>
        <hr />
        <button class="btn btn-danger w-100" onclick="logout()">
          🔐 Đăng xuất
        </button>
      </div>
    </div>

  <div class="page">
  <h1>Tổng quan chỉ tiêu</h1>

  <!-- Inputs for targets -->
  <div class="mb-3">
    <div class="d-flex w-100 gap-2 flex-column flex-md-row flex-wrap align-items-center">
      <div class="d-flex align-items-center gap-2 me-3">
        <label class="mb-0 me-2 text-muted">Chỉ tiêu MC:</label>
        <input id="inputTargetMC" type="text" class="form-control w-100 w-md-auto" style="min-width:140px" />
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="mb-0 ms-0 me-2 text-muted">Chỉ tiêu DL:</label>
        <input id="inputTargetDL" type="text" class="form-control w-100 w-md-auto" style="min-width:140px" />
      </div>
      <div class="d-flex align-items-center gap-2">
      <button id="saveTargetsBtn" class="btn btn-primary">Lưu</button>
      <span id="saveStatus" class="text-success"></span>
      </div>
    </div>
  </div>

  <!-- Date range for data -->
  <div class="mb-3">
    <div class="d-flex gap-2 flex-column flex-sm-row align-items-start">
      <div class="d-flex flex-column">
        <label class="mb-1 text-muted">Từ ngày</label>
        <input id="inputFromDate" type="date" class="form-control" />
      </div>
      <div class="d-flex flex-column">
        <label class="mb-1 text-muted">Đến ngày</label>
        <input id="inputToDate" type="date" class="form-control" />
      </div>
      <div class="d-flex align-items-end">
          <!-- Tải dữ liệu removed: auto-load on date change -->
      </div>
    </div>
  </div>

    <div class="chart-wrap p-3 bg-white rounded shadow-sm">
    <canvas id="overviewChart"></canvas>
  </div>
  
    <!-- Customers table -->
    <div class="card mt-4 p-3" id="customersCard">
      <h5 class="mb-3">Danh sách khách hàng</h5>
      <div id="customersSummary" class="mb-2 text-muted small">&nbsp;</div>
      <div class="table-responsive">
        <table class="table table-sm table-hover" id="customersTable">
          <thead>
            <tr><th>#</th><th>Tên khách</th><th>SĐT</th><th>CMND</th><th>Hợp đồng</th><th>Loại</th><th>Số tiền</th></tr>
          </thead>
          <tbody id="customersTbody"></tbody>
        </table>
      </div>
      <div class="text-muted small">Nhấp vào một dòng để xem thông tin sản phẩm.</div>
    </div>

    <!-- Login modal: will appear if no auth token is stored -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Đăng nhập</h5>
          </div>
          <div class="modal-body">
            <div id="loginError" class="text-danger mb-2" style="display:none;"></div>
            <div class="mb-3">
              <label class="form-label">Tài khoản</label>
              <input id="loginUsername" class="form-control" autocomplete="username" />
            </div>
            <div class="mb-3">
              <label class="form-label">Mật khẩu</label>
              <div class="input-group">
                <input id="loginPassword" type="password" class="form-control" autocomplete="current-password" />
                <button class="btn btn-outline-secondary" type="button" id="togglePassBtn" aria-label="Hiển thị mật khẩu">👁️</button>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button id="loginBtn" class="btn btn-primary">Đăng nhập</button>
          </div>
        </div>
      </div>
    </div>
  <!-- Chart.js and datalabels plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    
    // Utility to format currency (VND)
    function fmt(v){
      return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + ' ₫';
    }

    // Defaults for targets (can be overridden by user/localStorage)
    const DEFAULT_MC = 164000000;
    const DEFAULT_DL = 80000000;
    // Achieved numbers will be computed from data.json (API) below
    let mcAch = 0;
    let dlAch = 0;

    // Fetch data.json and compute achieved amounts grouped by type
    function fetchAchievedFromData(){
      return fetch('data.json')
        .then(r=>{
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data=>{
          mcAch = 0; dlAch = 0;
          const arr = data.contracts || [];
          arr.forEach(c=>{
            const ty = (c.type === '2W') ? 'MC' : (c.type === 'DL' ? 'DL' : null);
            if(!ty) return;
            // prefer financedAmount, fallback to totalPurchase
            const val = Number(c.financedAmount || c.totalPurchase || 0);
            if(ty === 'MC') mcAch += val; else if(ty === 'DL') dlAch += val;
          });
          return { mcAch, dlAch };
        });
    }

    function parseNumberInput(s){
      if(s === null || s === undefined) return 0;
      // remove dots/commas/spaces
      const cleaned = String(s).replace(/[\.\,\s]/g,'');
      const n = Number(cleaned);
      return isNaN(n) ? 0 : n;
    }

    function getStoredTargets(){
      const m = parseNumberInput(localStorage.getItem('targetMC')) || DEFAULT_MC;
      const d = parseNumberInput(localStorage.getItem('targetDL')) || DEFAULT_DL;
      return { mcTarget: m, dlTarget: d };
    }

    // Set up initial input values
    const inputMC = document.getElementById('inputTargetMC');
    const inputDL = document.getElementById('inputTargetDL');
    const saveBtn = document.getElementById('saveTargetsBtn');
    const saveStatus = document.getElementById('saveStatus');

    // Chart rendering logic
    let chartInstance = null;
    function renderChart(mcTarget, dlTarget){
      const data = {
        labels: ['Chỉ Tiêu','Số tiền đã đạt'],
        datasets: [
          { label: 'MC', backgroundColor: '#2b8be6', data: [mcTarget, mcAch], stack: 'stack1' },
          { label: 'DL', backgroundColor: '#e64b4b', data: [dlTarget, dlAch], stack: 'stack1' }
        ]
      };

      const cfg = {
        type: 'bar',
        data: data,
        plugins: [ChartDataLabels],
        options: {
          plugins: {
            legend: { position: 'top' },
            datalabels: { color: '#fff', anchor: 'center', formatter: v=> v ? fmt(v) : '', font: { weight: '600' } },
            tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmt(ctx.parsed.y) } }
          },
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { stacked: true }, y: { stacked: true, ticks: { callback: v=> v.toLocaleString('vi-VN') + ' ₫' } } }
        }
      };

      const ctx = document.getElementById('overviewChart').getContext('2d');
      if(chartInstance) { chartInstance.destroy(); }
      chartInstance = new Chart(ctx, cfg);
    }

    function renderSummary(mcTarget, dlTarget){
      const mcTotal = mcTarget;
      const mcAchieved = mcAch;
      const mcRemain = mcTotal - mcAchieved;
      const mcRate = mcTotal ? (mcAchieved / mcTotal * 100) : 0;

      const dlTotal = dlTarget;
      const dlAchieved = dlAch;
      const dlRemain = dlTotal - dlAchieved;
      const dlRate = dlTotal ? (dlAchieved / dlTotal * 100) : 0;

      const totalTarget = mcTotal + dlTotal;
      const totalAch = mcAchieved + dlAchieved;
      const totalRemain = totalTarget - totalAch;
      const totalRate = totalTarget ? (totalAch / totalTarget * 100) : 0;

      const summaryHtml = `
        <div id="summaryBox" style="margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start;">
          <div style="flex:1; min-width:220px;">
            <table style="width:100%; border-collapse:collapse; font-size:15px; background:#eef7ff; border:2px solid #2f3b52;">
              <tr><td style="border:1px solid #2f3b52; padding:10px; font-weight:700;">MC - Chỉ tiêu</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right; color:#1e88e5; font-weight:700;">${fmt(mcTotal)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Đã đạt</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right;">${fmt(mcAchieved)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Còn thiếu</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right; color:#e53935">${fmt(mcRemain)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Tỷ lệ</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right;">${mcRate.toFixed(2)}%</td></tr>
            </table>
          </div>

          <div style="flex:1; min-width:220px;">
            <table style="width:100%; border-collapse:collapse; font-size:15px; background:#fff5f5; border:2px solid #2f3b52;">
              <tr><td style="border:1px solid #2f3b52; padding:10px; font-weight:700;">DL - Chỉ tiêu</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right; color:#e64b4b; font-weight:700;">${fmt(dlTotal)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Đã đạt</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right;">${fmt(dlAchieved)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Còn thiếu</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right; color:#e53935">${fmt(dlRemain)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Tỷ lệ</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right;">${dlRate.toFixed(2)}%</td></tr>
            </table>
          </div>

          <div style="flex:1; min-width:220px;">
            <table style="width:100%; border-collapse:collapse; font-size:15px; background:#e9edf3; border:2px solid #2f3b52;">
              <tr><td style="border:1px solid #2f3b52; padding:10px; font-weight:700;">Tổng</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right; color:#2f3b52; font-weight:700;">${fmt(totalTarget)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Tổng đã đạt</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right;">${fmt(totalAch)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Tổng thiếu</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right; color:#e53935">${fmt(totalRemain)}</td></tr>
              <tr><td style="border:1px solid #2f3b52; padding:10px;">Tỷ lệ</td><td style="border:1px solid #2f3b52; padding:10px; text-align:right;">${totalRate.toFixed(2)}%</td></tr>
            </table>
          </div>
        </div>
      `;
      // replace or insert
      const existing = document.getElementById('summaryBox');
      if(existing) existing.outerHTML = summaryHtml; else document.querySelector('.chart-wrap').insertAdjacentHTML('afterend', summaryHtml);
    }

    // AUTH helpers
    function getAuthToken(){ return localStorage.getItem('authToken'); }
    function setAuthToken(t){ localStorage.setItem('authToken', t); }
    function clearAuthToken(){ localStorage.removeItem('authToken'); }

    // Fetch wrapper that sends Authorization header when token present
    // Accepts optional from/to dates in input date format (YYYY-MM-DD). The API expects DD-MM-YYYY
    function formatApiDateFromInput(d){ // 'YYYY-MM-DD' -> 'DD-MM-YYYY'
      if(!d) return '';
      const parts = d.split('-'); if(parts.length !== 3) return d;
      return parts[2] + '-' + parts[1] + '-' + parts[0];
    }

    function getStoredAuthUser(){
      try{ const j = localStorage.getItem('authUser'); return j ? JSON.parse(j) : null; }catch(e){ return null; }
    }

    // JWT helpers: basic payload parse and expiry check
    function parseJwtPayload(token){
      try{
        const parts = token.split('.'); if(parts.length < 2) return null;
        const payload = parts[1].replace(/-/g,'+').replace(/_/g,'/');
        const json = decodeURIComponent(atob(payload).split('').map(function(c){ return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
        return JSON.parse(json);
      }catch(e){ return null; }
    }

    function isTokenValid(token){
      if(!token) return false;
      const p = parseJwtPayload(token); if(!p) return false;
      if(p.exp && typeof p.exp === 'number'){
        const now = Math.floor(Date.now()/1000);
        // consider token invalid if exp <= now
        return p.exp > now;
      }
      return true; // no exp claim — assume valid
    }

    function fetchAchievedFromData(fromInput, toInput){
      const token = getAuthToken();
      const authUser = getStoredAuthUser();
      // ensure token is present and not expired
      if(!token || !isTokenValid(token)){
        clearAuthToken(); try{ localStorage.removeItem('authUser'); }catch(e){}
        showLogin();
        return Promise.reject(new Error('Token expired or missing. Please login.'));
      }
      // require user id
      if(!(authUser && authUser.id)){
        showLogin();
        return Promise.reject(new Error('No user info available. Please login.'));
      }
      const id = authUser.id;
      const fromApi = fromInput ? formatApiDateFromInput(fromInput) : formatApiDateFromInput(defaultFromDate());
      const toApi = toInput ? formatApiDateFromInput(toInput) : formatApiDateFromInput(defaultToDate());
      // include pagination params (page & size) - API rejects requests without them
      const url = `https://hpo.hdsaison.com.vn/hpo/api/v1/contracts/usercreated/${id}?page=0&size=1000&sort=created_date,desc&statusCodes=WAIT_FOR_CHECKING_DISBURSEMENT_STATUS-APPROVED_HARD_COPY_STATUS&fromDate=${encodeURIComponent(fromApi)}&toDate=${encodeURIComponent(toApi)}&contractNumber=`;
      return fetch(url, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' } })
        .then(async r=>{
          if(!r.ok){
            // try to read response body (json or text) to show better error
            let bodyText = '';
            try{ bodyText = await r.text(); }catch(e){}
            const trace = r.headers.get('tracelogid') || r.headers.get('TraceLogId') || '';
            const msg = `HTTP ${r.status}` + (bodyText ? (': ' + bodyText) : '') + (trace ? (' (trace:' + trace + ')') : '');
            throw new Error(msg);
          }
          return r.json();
        })
        .then(data=>{
          // expect API returns either a paged object (`content`), an object with `contracts`, or a raw array
          const arr = data && (data.content || data.contracts) ? (data.content || data.contracts) : (Array.isArray(data) ? data : []);
          mcAch = 0; dlAch = 0;
          arr.forEach(c=>{
            const ty = (c.type === '2W') ? 'MC' : (c.type === 'DL' ? 'DL' : null);
            if(!ty) return;
            const val = Number(c.financedAmount || c.totalPurchase || 0);
            if(ty === 'MC') mcAch += val; else if(ty === 'DL') dlAch += val;
          });
          return { mcAch, dlAch };
        });
    }

    // date helpers: default to current month
    function pad(n){ return n<10 ? '0'+n : String(n); }
    function defaultFromDate(){ const d = new Date(); d.setDate(1); return d.toISOString().slice(0,10); }
    function defaultToDate(){ const d = new Date(); return d.toISOString().slice(0,10); }

    // Login modal handling
    const loginModalEl = document.getElementById('loginModal');
    const loginModal = new bootstrap.Modal(loginModalEl, { backdrop: 'static', keyboard: false });
    const loginBtnEl = document.getElementById('loginBtn');
    const loginErrorEl = document.getElementById('loginError');
    const loginUserEl = document.getElementById('loginUsername');
    const loginPassEl = document.getElementById('loginPassword');
    const togglePassBtn = document.getElementById('togglePassBtn');
    const inputFromDate = document.getElementById('inputFromDate');
    const inputToDate = document.getElementById('inputToDate');
      // const reloadDataBtn = document.getElementById('reloadDataBtn'); // Removed manual reload button
      // Auto-load when date inputs change (debounced)
      let _loadTimer = null;
      function scheduleReload(){
        clearTimeout(_loadTimer);
        _loadTimer = setTimeout(()=>{
          const f = inputFromDate.value || defaultFromDate();
          const t = inputToDate.value || defaultToDate();
          fetchAchievedFromData(f,t).then(()=>{
            const stored = getStoredTargets();
            renderChart(stored.mcTarget, stored.dlTarget);
            renderSummary(stored.mcTarget, stored.dlTarget);
            // reload customers list for the new date range
            if(typeof loadCustomersTable === 'function') loadCustomersTable();
          }).catch(err=>{
            console.warn('Tải dữ liệu lỗi', err);
            const msg = document.createElement('div'); msg.style.color='red'; msg.style.marginTop='8px';
            msg.textContent = 'Tải dữ liệu lỗi: ' + (err && err.message ? err.message : 'Kiểm tra kết nối và đăng nhập');
            document.querySelector('.chart-wrap').insertAdjacentElement('afterend', msg);
          });
        }, 350);
      }
      if(inputFromDate) inputFromDate.addEventListener('change', scheduleReload);
      if(inputToDate) inputToDate.addEventListener('change', scheduleReload);

    // Toggle password visibility
    if(togglePassBtn){
      togglePassBtn.addEventListener('click', ()=>{
        if(loginPassEl.type === 'password'){
          loginPassEl.type = 'text';
          togglePassBtn.textContent = '🙈';
          togglePassBtn.setAttribute('aria-label','Ẩn mật khẩu');
        } else {
          loginPassEl.type = 'password';
          togglePassBtn.textContent = '👁️';
          togglePassBtn.setAttribute('aria-label','Hiển thị mật khẩu');
        }
      });
    }

    function showLogin(){ loginErrorEl.style.display = 'none'; loginErrorEl.textContent = '';
      loginUserEl.value = ''; loginPassEl.value = ''; loginModal.show();
    }

    function startApp(){
      // read dates from inputs (if set) or use defaults
      const from = inputFromDate.value || null;
      const to = inputToDate.value || null;
      fetchAchievedFromData(from, to).then(()=>{
        const stored = getStoredTargets();
        inputMC.value = stored.mcTarget.toLocaleString('vi-VN');
        inputDL.value = stored.dlTarget.toLocaleString('vi-VN');
        renderChart(stored.mcTarget, stored.dlTarget);
        renderSummary(stored.mcTarget, stored.dlTarget);
        // load customers after initial data load
        if(typeof loadCustomersTable === 'function') loadCustomersTable();
      }).catch(err=>{
        console.warn('Không thể tải dữ liệu từ API:', err);
        const msg = document.createElement('div');
        msg.style.color = 'red'; msg.style.marginTop = '8px';
        msg.textContent = 'Cảnh báo: không thể tải dữ liệu từ API. ' + (err && err.message ? err.message : 'Vui lòng đăng nhập hoặc kiểm tra kết nối.');
        document.querySelector('.chart-wrap').insertAdjacentElement('afterend', msg);
      });
    }

    // Real login: POST to auth API and store accessToken + user info
    loginBtnEl.addEventListener('click', async ()=>{
      const u = (loginUserEl.value || '').trim();
      const p = (loginPassEl.value || '');
      if(!u || !p){ loginErrorEl.style.display = 'block'; loginErrorEl.textContent = 'Nhập tài khoản và mật khẩu'; return; }
      loginBtnEl.disabled = true;
      loginErrorEl.style.display = 'none';
      try{
        const res = await fetch('https://hpo.hdsaison.com.vn/hpo/api/v1/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const body = await res.json().catch(()=>null);
        if(!res.ok){
          const msg = body && (body.message || body.error) ? (body.message || body.error) : ('HTTP ' + res.status);
          loginErrorEl.style.display = 'block'; loginErrorEl.textContent = msg;
          loginBtnEl.disabled = false; return;
        }
        // Extract accessToken from common response shapes
        const accessToken = body && (body.accessToken || body.token || (body.data && (body.data.accessToken || body.data.token)));
        if(!accessToken){
          loginErrorEl.style.display = 'block'; loginErrorEl.textContent = 'Không nhận được accessToken từ server';
          loginBtnEl.disabled = false; return;
        }
        setAuthToken(accessToken);
        // Normalize and store user payload. API responses vary; try common locations and ensure `id` exists.
        let userPayload = null;
        if(body){
          if(body.user) userPayload = body.user;
          else if(body.data && body.data.user) userPayload = body.data.user;
          else if(body.data && (body.data.id || body.data.userId)) userPayload = body.data;
          else if(body.id || body.userId) userPayload = body;
        }
        // Fallback: if we couldn't find a user object, store an empty object (prevents missing id errors)
        if(!userPayload) userPayload = {};
        // Ensure `id` exists on the stored payload by searching common locations
        try{
          const maybeId = userPayload.id || userPayload.userId || (body && body.data && (body.data.id || body.data.userId)) || (body && (body.id || body.userId));
          if(maybeId) userPayload.id = maybeId;
        }catch(e){}
        try{ localStorage.setItem('authUser', JSON.stringify(userPayload)); }catch(e){}
        loginModal.hide();
        loginBtnEl.disabled = false;
        startApp();
      }catch(err){
        loginErrorEl.style.display = 'block'; loginErrorEl.textContent = 'Lỗi kết nối: ' + (err.message || err);
        loginBtnEl.disabled = false;
      }
    });

    // submit on Enter
    loginPassEl.addEventListener('keyup', (e)=>{ if(e.key === 'Enter') loginBtnEl.click(); });

    // Kickoff: set default date inputs and then auth check
    if(inputFromDate) inputFromDate.value = defaultFromDate();
    if(inputToDate) inputToDate.value = defaultToDate();
      // Removed manual reload button event listener
      // if(reloadDataBtn){ reloadDataBtn.addEventListener('click', scheduleReload); }

    // On startup check token validity and require login if missing/expired
    const initialToken = getAuthToken();
    if(initialToken && isTokenValid(initialToken)) startApp(); else { clearAuthToken(); try{ localStorage.removeItem('authUser'); }catch(e){}; showLogin(); }

    // Save handler
    saveBtn.addEventListener('click', ()=>{
      const mc = parseNumberInput(inputMC.value) || DEFAULT_MC;
      const dl = parseNumberInput(inputDL.value) || DEFAULT_DL;
      localStorage.setItem('targetMC', String(mc));
      localStorage.setItem('targetDL', String(dl));
      renderChart(mc, dl);
      renderSummary(mc, dl);
      saveStatus.textContent = 'Đã lưu';
      setTimeout(()=> saveStatus.textContent = '', 2500);
    });

    // Logout (clear auth token and session)
    function logout(){ sessionStorage.clear(); localStorage.removeItem('authToken'); location.reload(); }
  </script>
  <!-- Product modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Chi tiết sản phẩm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="productList"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Try loading contracts from API (when logged in) else fall back to data.json
    async function fetchContractsFromApi(fromInput, toInput){
      const token = getAuthToken();
      const authUser = getStoredAuthUser();
      if(!token || !isTokenValid(token) || !(authUser && authUser.id)){
        return null; // signal to caller to fallback
      }
      const id = authUser.id;
      const fromApi = fromInput ? formatApiDateFromInput(fromInput) : formatApiDateFromInput(defaultFromDate());
      const toApi = toInput ? formatApiDateFromInput(toInput) : formatApiDateFromInput(defaultToDate());
      const url = `https://hpo.hdsaison.com.vn/hpo/api/v1/contracts/usercreated/${id}?page=0&size=1000&sort=created_date,desc&statusCodes=WAIT_FOR_CHECKING_DISBURSEMENT_STATUS-APPROVED_HARD_COPY_STATUS&fromDate=${encodeURIComponent(fromApi)}&toDate=${encodeURIComponent(toApi)}&contractNumber=`;
      try{
        const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' } });
        if(!r.ok) throw new Error('HTTP '+r.status);
        const data = await r.json();
        // contract list might be in content or contracts or array
        const arr = data && (data.content || data.contracts) ? (data.content || data.contracts) : (Array.isArray(data) ? data : []);
        return arr;
      }catch(err){ console.warn('API load contracts failed:', err); return null; }
    }

    async function loadCustomersTable(){
      try{
        // try API first (using date filters currently set)
        const from = inputFromDate.value || defaultFromDate();
        const to = inputToDate.value || defaultToDate();
        let arr = await fetchContractsFromApi(from, to);
        if(!arr){
          // fallback to local data.json
          const res = await fetch('data.json');
          if(!res.ok) throw new Error('Cannot load data.json');
          const j = await res.json();
          arr = j.contracts || [];
        }
        const tbody = document.getElementById('customersTbody');
        tbody.innerHTML = '';
        // compute average tenor (tenorInMonths) for MC contracts only
        let sumTenor = 0, countTenor = 0;
        arr.forEach(c=>{
          const ty = (c.type === '2W') ? 'MC' : (c.type === 'DL' ? 'DL' : null);
          if(ty !== 'MC') return; // only MC
          const t = Number(c.tenorInMonths || c.tenor || 0);
          if(!Number.isNaN(t) && t > 0){ sumTenor += t; countTenor++; }
        });
        const avgTenor = countTenor ? Math.round((sumTenor / countTenor) * 100) / 100 : 0;
        const summaryEl = document.getElementById('customersSummary');
        summaryEl.textContent = `Trung bình kỳ hạn vay (MC): ${avgTenor} tháng (dựa trên ${countTenor} hợp đồng MC)`;
        arr.forEach((c, idx)=>{
          const cust = c.customer || {};
          const name = [cust.lastName, cust.middleName, cust.firstName].filter(Boolean).join(' ');
          const phone = cust.phoneNumber || '';
          const nid = cust.nationalId || '';
          const contractNo = c.number || c.code || '';
          const type = c.type || '';
          const amount = c.financedAmount || c.totalPurchase || 0;
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          const colLabels = ['#','Tên khách','SĐT','CMND','Hợp đồng','Loại','Số tiền'];
          const colValues = [String(idx+1), name, phone, nid, contractNo, type, amount.toLocaleString('vi-VN') + ' ₫'];
          colValues.forEach((val,i)=>{
            const td = document.createElement('td');
            td.setAttribute('data-label', colLabels[i]);
            if(i === 6) td.style.textAlign = 'right';
            td.textContent = val;
            tr.appendChild(td);
          });
          tr.addEventListener('click', ()=> showProductsForContract(c));
          tbody.appendChild(tr);
        });
      }catch(err){ console.warn('Không thể load customers:', err); }
    }

    function showProductsForContract(contract){
      const modalEl = document.getElementById('productModal');
      const modal = new bootstrap.Modal(modalEl);
      const container = document.getElementById('productList');
      container.innerHTML = '';
      const prods = (contract.submittedProducts && contract.submittedProducts.length) ? contract.submittedProducts : (contract.contractProducts || []);
      if(!prods || prods.length === 0){ container.innerHTML = '<div class="text-muted">Không có sản phẩm.</div>'; modal.show(); return; }
      const table = document.createElement('table'); table.className = 'table table-sm';
      const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>#</th><th>Mã/Model</th><th>Giá</th></tr>'; table.appendChild(thead);
      const tb = document.createElement('tbody');
      prods.forEach((p,i)=>{
        const tr = document.createElement('tr');
        const name = p.modelDesc || p.name || p.productName || '';
        const price = p.productPrice || p.productPrice || p.price || 0;
        tr.innerHTML = `<td>${i+1}</td><td>${name}</td><td style="text-align:right">${Number(price).toLocaleString('vi-VN')} ₫</td>`;
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      container.appendChild(table);
      modal.show();
    }

    // load on script end
    loadCustomersTable();
  </script>
</body>
