<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log(getRequiredDocuments(0, 0, 'low_risk'));
        function getRequiredDocuments(fa, dp, vehicleType = 'normal') {

            // vehicleType:
            // 'low_risk' = dòng xe rủi ro thấp
            // 'normal'   = các dòng xe khác
            if(fa <= 0) {
                return {
                    success: false,
                    documents: [],
                    message: 'Khoản vay phải là số dương'
                };
            }

            let documents = ['CCCD'];
            if(fa >= 80000000) {
                return {
                    success: true,
                    documents: documents,
                    message: `Cần các chứng từ: ${documents.join(', ')}`
                };
            }
            if(fa >= 50000000 && fa < 80000000) {
                if(vehicleType === 'low_risk') {
                    if(dp < 30) {
                        documents.push('POA', 'POI');
                    }
                } else {
                    if(dp < 50) {
                        documents.push('POA', 'POI');
                    }
                }
                return {
                    success: true,
                    documents: documents,
                    message: `Cần các chứng từ: ${documents.join(', ')}`
                };
            }
            if(fa >= 35000000 && fa < 50000000) {
                if(dp < 10) {
                    documents.push('POA/BHYT/GPLX', 'Field check');
                }
                return {
                    success: true,
                    documents: documents,
                    message: `Cần các chứng từ: ${documents.join(', ')}`
                };
            }
            if(fa < 35000000) {
                return {
                    success: true,
                    documents: documents,
                    message: `Cần các chứng từ: ${documents.join(', ')}`
                };
            }

        }
    </script>
</body>

</html>
